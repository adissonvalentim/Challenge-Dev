# Ambiente isolado: não publica portas e não usa o volume de desenvolvimento.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mini_cx_test
      POSTGRES_USER: mini_cx
      POSTGRES_PASSWORD: integration_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_cx -d mini_cx_test"]
      interval: 2s
      timeout: 5s
      retries: 15
  api:
    build: ./backend
    environment:
      ConnectionStrings__Database: "Host=db;Database=mini_cx_test;Username=mini_cx;Password=integration_test"
      Seed__Path: /data/seed.json
      Logging__LogLevel__Default: Warning
    volumes:
      - ./data/seed.json:/data/seed.json:ro
    depends_on:
      db:
        condition: service_healthy
  tests:
    image: node:22-alpine
    working_dir: /tests
    command: ["node", "--test", "contract.test.mjs"]
    environment:
      API_BASE: http://api:8080
    volumes:
      - ./tests:/tests:ro
      - ./data/seed.json:/data/seed.json:ro
    depends_on:
      api:
        condition: service_started
