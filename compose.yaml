services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mini_cx
      POSTGRES_USER: mini_cx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/Database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_cx -d mini_cx"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
